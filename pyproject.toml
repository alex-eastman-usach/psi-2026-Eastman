[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "psi-lab"
version = "0.1.0"
description = "Laboratorios de Procesamiento de Senales e Imagenes (13318), USACH"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexander Eastman", email = "alexander.eastman@usach.cl" },
            { name = "Juan Campos", email = "juan.campos.a@usach.cl" },
            { name = "Francisco Briones", email = "francisco.briones.g@usach.cl" },
            { name = "", email = "@usach.cl" }]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
[project.scripts]
psi-demo = "psi_lab.cli:main"
psi-lab1 = "psi_lab.lab1.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]